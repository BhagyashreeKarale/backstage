name: Sync Pull Requests Trigger

on:
  pull_request_target:
    types:
      - opened
      - closed
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]

jobs:
  trigger:
    if: >
      github.repository == 'backstage/backstage' &&
      github.event.sender.type != 'Bot' &&
      (github.event.pull_request || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Save PR context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          LABEL_ADDED: ${{ github.event.action == 'labeled' && github.event.label.name || '' }}
          REVIEW_STATE: ${{ github.event.review.state }}
          ACTOR: ${{ github.actor }}
          ACTION: ${{ github.event.action }}
        run: |
          mkdir -p ./context
          echo "$PR_NUMBER" > ./context/pr-number
          echo "$LABEL_ADDED" > ./context/label-added
          echo "$REVIEW_STATE" > ./context/review-state
          echo "$ACTOR" > ./context/actor
          echo "$ACTION" > ./context/action

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-context
          path: context/
          overwrite: true
